<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Daily Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <a href="/" class="navbar-brand">💰 Expense Tracker</a>
            <ul class="navbar-nav">
                <li><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Dashboard</a></li>
                <li><a href="/expenses" class="nav-link {% if request.path == '/expenses' %}active{% endif %}">Expenses</a></li>
                <li><a href="/analytics" class="nav-link {% if request.path == '/analytics' %}active{% endif %}">Analytics</a></li>
                <li><a href="/household" class="nav-link {% if request.path == '/household' %}active{% endif %}">Household</a></li>
                <li><a href="/reports" class="nav-link {% if request.path == '/reports' %}active{% endif %}">Reports</a></li>
                <li><a href="/users" class="nav-link {% if request.path == '/users' %}active{% endif %}">Users</a></li>
                <li><button class="theme-toggle" onclick="toggleTheme()">🌙</button></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main style="padding: var(--spacing-2xl) 0;">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer style="text-align: center; padding: var(--spacing-xl); color: var(--text-secondary);">
        <p>&copy; 2024 Daily Expense Tracker. Built with ❤️ for better financial management.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
